<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- 04 凝露 Dew Lattice — 点阵×几何：圆点凝成眼睛，瞳孔以留白呈现 -->
  <defs>
    <clipPath id="eye-clip">
      <path d="M12 50 Q50 18 88 50 Q50 82 12 50 Z"/>
    </clipPath>
  </defs>
  <!-- 极淡的眼廓锚线 -->
  <path d="M12 50 Q50 18 88 50 Q50 82 12 50 Z" stroke="currentColor" stroke-width="1" opacity="0.3" fill="none"/>
  <!-- 密度渐变点阵（瞳孔处留白） -->
  <g fill="currentColor">
    <circle cx="33"   cy="38" r="2.2"/>
    <circle cx="41.5" cy="38" r="2.2"/>
    <circle cx="50"   cy="38" r="2.2"/>
    <circle cx="58.5" cy="38" r="2.2"/>
    <circle cx="67"   cy="38" r="2.2"/>
    <circle cx="25" cy="44" r="2.5"/>
    <circle cx="33" cy="44" r="2.5"/>
    <circle cx="42" cy="44" r="2.5"/>
    <circle cx="58" cy="44" r="2.5"/>
    <circle cx="66" cy="44" r="2.5"/>
    <circle cx="74" cy="44" r="2.5"/>
    <circle cx="21" cy="50" r="2.8"/>
    <circle cx="29" cy="50" r="2.8"/>
    <circle cx="37" cy="50" r="2.8"/>
    <circle cx="61" cy="50" r="2.8"/>
    <circle cx="69" cy="50" r="2.8"/>
    <circle cx="77" cy="50" r="2.8"/>
    <circle cx="25" cy="56" r="2.5"/>
    <circle cx="33" cy="56" r="2.5"/>
    <circle cx="42" cy="56" r="2.5"/>
    <circle cx="58" cy="56" r="2.5"/>
    <circle cx="66" cy="56" r="2.5"/>
    <circle cx="74" cy="56" r="2.5"/>
    <circle cx="33"   cy="62" r="2.2"/>
    <circle cx="41.5" cy="62" r="2.2"/>
    <circle cx="50"   cy="62" r="2.2"/>
    <circle cx="58.5" cy="62" r="2.2"/>
    <circle cx="67"   cy="62" r="2.2"/>
  </g>
  <!-- 中心一点露光：唯一焦点 -->
  <circle cx="50" cy="50" r="1.8" fill="currentColor"/>
</svg>
