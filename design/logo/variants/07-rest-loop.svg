<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- 07 息环 Rest Loop — 融合：息时的 270° 走时弧 × 休止环的闭眼弧 -->
  <path d="M50 16 A34 34 0 1 1 16 50" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <!-- 缺口处的微点：循环仍会继续 -->
  <circle cx="26" cy="26" r="2" fill="currentColor" opacity="0.35"/>
  <!-- 圆心：安然闭合的眼 -->
  <path d="M36 47 Q50 61 64 47" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" fill="none"/>
</svg>
